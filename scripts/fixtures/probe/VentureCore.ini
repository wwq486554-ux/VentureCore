; Shipped probe fixture for:
;     python3 scripts/check_live_log.py --mode probe
;
; Usage: copy this file next to gamemd.exe as <Platform>.ini (the file name is
; VC_PLATFORM_INI_NAME from src/Core/PlatformConfig.h), start the game once, then
; run the probe check against that game directory.  check_live_log.py also reads
; this file directly: it requires the installed <Platform>.ini to be this file
; (so the log expectations below are justified) and it derives the generated
; template name / mtime freshness from the same platform header.
;
; What it deliberately contains (do not "clean up" these lines - the probe
; expectations in check_live_log.py depend on them):
;   * the R1 template route: DumpIniTemplate=yes and LogLevel=debug;
;   * case variants: lower-case section/key names and a mixed-case value,
;     which the Win32 profile API and the key registry must accept;
;   * an invalid value for a registered [Platform] bool that is read before the
;     startup `ini keys:` summary -> the `invalid` counter must be >= 1;
;   * two unknown entries -> the `unknown` counter must be >= 2: one unknown key
;     in the known [Platform] section and one misspelled [Features] switch
;     ("Exampel"), which must produce the "did you mean Example?" suggestion;
;   * a valid [Features] switch in lower case ("example=YES"), to show the
;     switch set is matched case-insensitively.
; Keep CRLF (.gitattributes: *.ini eol=crlf).

[PLATFORM]
loglevel=debug
dumpinitemplate=YES
; Unknown key in a known section: counted in `unknown`.
PlatformBogusKey=1
; Invalid bool for a registered base key, read before the startup summary:
; counted in `invalid` and warned about in the log.
debugoutput=notabool

[features]
example=YES
ExampleIniKey=yes
; Misspelled switch: counted in `unknown` and suggested as "Example".
Exampel=yes
