; Fixture for tests/test_ini_adapter.cpp (INI-02).
;
; The test copies this file next to the test executable as <Platform>.ini and
; then drives the *production* adapter over the real Win32 profile API:
;   Ini::Load() -> PlatformPaths::GetGameDirectory/GetGameFilePath
;               -> Ini::GetString / Ini::EnumerateEntries -> GetPrivateProfile*
; Keep every value distinguishable: the truncation cases are told apart by the
; character they repeat, and the enumeration cases by their file order.
;
; The invariant sections below are deliberate.  Do not reformat, do not add a
; BOM, keep the file CRLF (the repository .gitattributes declares *.ini eol=crlf;
; scripts/linux/check_eol.py enforces it).

[Platform]
; Plausible <Platform>.ini keys - they prove the fixture is a real platform INI
; and not just a synthetic value table.
LogLevel=debug
IniWarnUnknownKeys=yes
DumpIniTemplate=no

[Case]
; Read with a different case by the test (the Win32 profile API is
; case-insensitive for both the section and the key).
MixedKey=MixedValue
UpperOnly=UPPER
mIxEdCaSe=case-preserved-value

[Values]
; (2) a key present with an empty value must read back as "" - not as the
; caller's default; the registry distinguishes "missing" from "empty" this way.
Empty=
; a normal value must override the caller's default (read with "fallback").
MissingButNeeded=present
; Recorded, not asserted: Win32 profile-API whitespace trimming.
Spaces=   
Padded=   padded value   
Quoted="quoted value"
; (4) the registry reads raw values into a 512-byte buffer, so a value is
; truncated at 511 characters plus the terminating NUL.




[Enum]
; (5) enumeration cases: file order, and a key padded with spaces is trimmed by
; Ini::EnumerateEntries before it reaches the registry.
Alpha=1
Beta=2
 SpacedKey = spaced value
